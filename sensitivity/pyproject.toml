[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "se-intensity-modeling"
version = "0.2.0"
description = "Reproducible HIM secondary-electron intensity model comparison"
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.17",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "pymc>=5.16,<6",
    "scikit-image>=0.22",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running production-fit or sampling validation",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
